[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "actkv-open"
version = "0.1.0"
description = "Unofficial open-source implementation of ActKV: action-guided KV cache management for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maurya Panchal" }]
# transformers 4.56.0 is the oldest release the test suite passes on (DynamicCache(config=...),
# cache.layers, from_pretrained(dtype=...)); every later release through 5.20.2 passes too.
dependencies = ["torch>=2.4", "transformers>=4.56.0"]

[project.optional-dependencies]
triton = ["triton>=3.0; sys_platform == 'linux'"]   # Triton only ships Linux wheels
alfworld = ["alfworld>=0.3.5", "pyyaml"]
eval = ["matplotlib"]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["actkv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
