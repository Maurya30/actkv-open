[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actkv-open"
version = "0.1.0"
description = "Unofficial open-source implementation of ActKV: action-guided KV cache management for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maurya Panchal" }]
dependencies = ["torch>=2.4", "transformers>=4.56", "numpy"]

[project.optional-dependencies]
triton = ["triton>=3.0"]
alfworld = ["alfworld", "pyyaml"]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["actkv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
